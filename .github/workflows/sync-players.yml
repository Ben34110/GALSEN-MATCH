name: Sync African players

on:
  schedule:
    # Daily (was weekly) — moved up once sync-african-players.mjs started
    # periodically re-verifying already-known players instead of only
    # enumerating new call-ups (see that script's ROTATION_BATCH_SIZE):
    # weekly meant any already-captured player's club/stats could go
    # months without a re-check, which is what let the whole dataset
    # silently freeze (confirmed: zero changes across 7 straight "success"
    # weekly runs, Aug 16 - Oct 4 2026). Daily runs cycle the ~2885-player
    # backlog through at ROTATION_BATCH_SIZE (200) players/day — about 2
    # weeks for a full pass — while staying well under the account's
    # 7500/day cap alongside poll/mercato (see that script's
    # MAX_LIVE_REQUESTS comment for the budget math). Offset an hour from
    # sync-mercato's 06:00 UTC slot so the two rarely land in the exact
    # same run even on days they coincide. Adjust the cron expression to
    # change it.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/sync-african-players.mjs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      # Re-seeds the players/teams Supabase tables that back global search
      # (see scripts/sync-search-tables.mjs) from the freshly-written JSON
      # above — no API-Football calls, just a Supabase upsert, so running
      # it every day alongside the player sync costs nothing quota-wise.
      - run: node scripts/sync-search-tables.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Unlike sync-mercato.mjs (writes straight to Supabase), this script's
      # output is the static src/lib/data/generated/african-players.json
      # file the app imports at build time — nothing changes for the
      # deployed app until that file is committed, which is what triggers
      # Vercel's auto-deploy from main.
      - name: Commit updated player data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/lib/data/generated/african-players.json; then
            echo "No player data changes."
          else
            git add src/lib/data/generated/african-players.json
            git commit -m "chore: sync African players data"
            git push
          fi
