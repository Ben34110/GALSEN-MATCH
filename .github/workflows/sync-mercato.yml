name: Sync Mercato transfers

on:
  schedule:
    # 06:00 UTC every 3rd day-of-month — this run alone makes ~1400
    # API-Football calls (one /transfers lookup per known player), which
    # was found to be a major contributor to the account hitting its daily
    # request quota and starving the rest of the app (CAN qualifiers, live
    # match features) for the remainder of the day. Transfer news doesn't
    # need daily freshness the way live match events do, so this trades a
    # little staleness for headroom. Adjust the cron expression to change
    # the cadence.
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/sync-mercato.mjs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
